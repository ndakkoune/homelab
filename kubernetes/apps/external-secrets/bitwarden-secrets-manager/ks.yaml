# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bitwarden-secrets-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/external-secrets/bitwarden-secrets-manager/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: external-secrets
  commonMetadata:
    labels:
      app.kubernetes.io/name: bitwarden-secrets-manager
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

# We need bitwarden to fetch our secrets, but we also need a token to access bitwarden secrets manager (chicken-and-egg problem).
# A sops age secret is used to provide this token.
# However, the Flux controller also needs the age private key to decrypt the encoded secret.
# So we manually precreate a `sops-age` Secret resource with it (or bootstrap during cluster creation).
