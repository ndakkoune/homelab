# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secrets-manager
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://vault.bitwarden.eu/api
      identityURL: https://vault.bitwarden.eu/identity
      auth:
        secretRef:
          credentials:
            key: token
            name: bitwarden-access-token
            namespace: external-secrets
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc:9998
      # TODO: Use trust-manager Bundle to avoid using ConfigMap
      # caBundle: ...
      caProvider:
        type: ConfigMap
        name: bitwarden-ca
        key: ca.crt
        namespace: external-secrets
      organizationID: d572a8f6-d91d-4c78-b40b-b35700eccbed
      projectID: 8b97febb-0e71-493c-b1e7-b3a5015813b2
