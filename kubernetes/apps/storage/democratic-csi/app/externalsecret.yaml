# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-nfs-driver-config
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: truenas-nfs-driver-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        driver-config-file.yaml: |-
          driver: freenas-api-nfs
          httpConnection:
            allowInsecure: true
            apiKey: {{ .apiKey }}
            host: 192.168.1.99
            port: 80
            protocol: http
          instance_id: null
          nfs:
            shareCommentTemplate: "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}-{{ parameters.[csi.storage.k8s.io/pvc/name] }}"
            shareAlldirs: false
            shareAllowedNetworks:
            - 192.168.1.0/24
            shareHost: 192.168.1.99
            shareMapallGroup: nfs
            shareMapallUser: nfs
          zfs:
            datasetEnableQuotas: true
            datasetEnableReservation: false
            datasetParentName: tank/kubernetes/nfs/volumes
            datasetPermissionsGroup: 3001
            datasetPermissionsMode: "0777"
            datasetPermissionsUser: 3001
            detachedSnapshotsDatasetParentName: tank/kubernetes/nfs/snapshots
            datasetProperties:
              "org.freenas:description": "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}/{{ parameters.[csi.storage.k8s.io/pvc/name] }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: democratic-csi-api-key
