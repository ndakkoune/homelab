# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: bitwarden-secrets-manager
# bitwarden-sdk-server requires to run in HTTPS mode.
# It needs the cert-manager CRDs.
# Since we can't reach any external secret stored in bitwarden until then, we make cert-amanager and btwarden-secrets-manager wait.
  targetNamespace: cert-manager
  commonMetadata:
    labels:
      app.kubernetes.io/name: cert-manager-issuers
  path: ./kubernetes/apps/cert-manager/cert-manager-issuers/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
